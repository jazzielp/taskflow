packages:
  - 'apps/*'
  - 'packages/*'
  - 'tooling/*'

# pnpm >= 10 no ejecuta scripts de instalación salvo que se autoricen aquí.
# Prisma necesita descargar sus motores y argon2/esbuild traen binarios nativos.
allowBuilds:
  '@prisma/engines': true
  argon2: true
  esbuild: true
  prisma: true

minimumReleaseAgeExclude:
  - '@types/node@22.20.2'
  - '@types/react-dom@19.3.0'
  - '@types/react@19.3.0'
  - lucide-react@1.44.0
  - vite@8.3.0
